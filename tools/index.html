<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANEW Tool Study Cards</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1413">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232dd4a7'/><path d='M50 18 L78 34 V66 L50 82 L22 66 V34 Z' fill='none' stroke='%2306231b' stroke-width='6' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/app.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg,#111);color:#fff;min-height:100vh;display:flex;flex-direction:column}
.shell-nav{width:100%}
header{padding:18px 24px 12px;border-bottom:1px solid #1e1e1e}
header h1{font-size:1.2rem;font-weight:700}
.trade-bar{padding:14px 24px 0;display:flex;gap:0;border-bottom:1px solid #1a1a1a}
.trade-btn{padding:8px 22px;border:none;border-bottom:2px solid transparent;background:transparent;color:#555;cursor:pointer;font-size:0.9rem;font-weight:600;transition:all 0.15s}
.trade-btn:hover{color:#aaa}
.trade-btn.active{color:#fff;border-bottom-color:#fff}
.controls{padding:10px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #1a1a1a}
.btn-group{display:contents}
.btn-group.hidden{display:none}
.filter-btn{padding:7px 18px;border:1px solid #333;background:transparent;color:#777;border-radius:4px;cursor:pointer;font-size:0.88rem;transition:all 0.15s}
.filter-btn:hover{border-color:#666;color:#ccc}
.filter-btn.active{background:#fff;color:#000;border-color:#fff}
.shuffle-btn{padding:7px 18px;border:1px solid #333;background:transparent;color:#777;border-radius:4px;cursor:pointer;font-size:0.88rem}
.shuffle-btn:hover{border-color:#666;color:#ccc}
.ctrl-divider{width:1px;background:#2a2a2a;align-self:stretch;margin:0 2px}
.count{color:#444;font-size:0.82rem;margin-left:auto}
.viewer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 40px}
.card-counter{font-size:0.82rem;color:#444;margin-bottom:16px}
.card-wrap{perspective:1000px;cursor:pointer;user-select:none;width:min(520px,90vw)}
.card-ratio{position:relative;width:100%;padding-top:75%}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 0.4s ease}
.card-wrap.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;overflow:hidden}
.card-front{background:transparent;display:flex;align-items:center;justify-content:center}
.card-front img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:8px}
.fn-name{width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:#f0f0f0;text-align:center;padding:24px;line-height:1.4;background:#1c1c1c;border:1px solid #2d2d2d}
.card-back{background:#1c1c1c;border:1px solid #2d2d2d;transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:0}
.card-back .name{font-size:1.5rem;font-weight:700;line-height:1.4;color:#f0f0f0}
.fn-func{font-size:1rem;color:#d0d0d0;line-height:1.65;display:none;text-align:center}
.card-back .cat-label{font-size:0.78rem;color:#555;margin-top:12px;text-transform:uppercase;letter-spacing:0.08em}
.hint{font-size:0.75rem;color:#333;margin-top:14px}
.nav{display:flex;gap:16px;align-items:center;margin-top:22px}
.nav-btn{padding:10px 28px;border:1px solid #333;background:transparent;color:#888;border-radius:6px;cursor:pointer;font-size:0.95rem;transition:all 0.15s}
.nav-btn:hover{border-color:#666;color:#fff}
.tape-cap{position:absolute;bottom:0;left:0;width:100%;padding:10px 16px;background:rgba(0,0,0,0.72);text-align:center;font-size:1.1rem;font-weight:700;color:#f0f0f0;display:none}
</style>
</head>
<body>

<nav class="shell-nav">
  <a class="shell-nav-brand" href="/">ANEW</a>
  <div class="shell-nav-links"><a href="/">Back to Home</a></div>
</nav>

<header>
  <h1>Tool Study Cards</h1>
</header>

<div class="trade-bar">
  <button class="trade-btn active" onclick="setTrade('pre',this)">Pre-Apprenticeship</button>
  <button class="trade-btn" onclick="setTrade('laborers',this)">Laborers</button>
</div>
<div class="controls">
  <div class="btn-group" id="btns-pre">
    <button class="filter-btn active" onclick="setFilter('all','images',this)">All Tools</button>
    <button class="filter-btn" onclick="setFilter('hand','images',this)">Hand Tools Only</button>
    <button class="filter-btn" onclick="setFilter('power','images',this)">Power Tools Only</button>
    <button class="filter-btn" onclick="setFilter('all','functions',this)">Tool Functions</button>
    <button class="filter-btn" onclick="setFilter('tape','functions',this)">Tape Measure</button>
    <button class="shuffle-btn" onclick="shuffle()">Shuffle</button>
    <button class="shuffle-btn" onclick="shuffleAll()">Shuffle All</button>
  </div>
  <div class="btn-group hidden" id="btns-laborers">
    <button class="filter-btn active" onclick="setFilterL('materials',this)">PCT Materials</button>
    <button class="filter-btn" onclick="setFilterL('tools',this)">PCT Tools</button>
    <button class="shuffle-btn" onclick="shuffle()">Shuffle</button>
    <button class="shuffle-btn" onclick="shuffleAllL()">Shuffle All</button>
  </div>
  <span class="count" id="count"></span>
</div>

<div class="viewer">
  <div class="card-counter" id="counter"></div>
  <div class="card-wrap" id="card" onclick="flip()">
    <div class="card-ratio">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <img id="cardImg" src="" alt="">
          <div class="fn-name" id="cardNameFront"></div>
          <div class="tape-cap" id="tapeCap"></div>
        </div>
        <div class="card-face card-back">
          <div class="name" id="cardName"></div>
          <div class="fn-func" id="cardDesc"></div>
          <div class="cat-label" id="cardCat"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint" id="hint">click to reveal</div>
  <div class="nav">
    <button class="nav-btn" onclick="prev()">Previous</button>
    <button class="nav-btn" onclick="next()">Next</button>
  </div>
</div>

let current = [...TOOLS];
let index = 0;
let mode = 'images';

function setTrade(t, btn) {
  document.querySelectorAll('.trade-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('btns-pre').classList.toggle('hidden', t !== 'pre');
  document.getElementById('btns-laborers').classList.toggle('hidden', t !== 'laborers');
  if (t === 'pre') {
    setFilter('all', 'images', document.querySelector('#btns-pre .filter-btn'));
  } else {
    setFilterL('materials', document.querySelector('#btns-laborers .filter-btn'));
  }
}

function setFilterL(f, btn) {
  document.querySelectorAll('#btns-laborers .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  mode = 'images';
  current = f === 'materials' ? [...PCT_MATERIALS] : [...PCT_TOOLS];
  index = 0;
  render();
}

function shuffleAllL() {
  document.querySelectorAll('#btns-laborers .filter-btn').forEach(b => b.classList.remove('active'));
  current = [...PCT_MATERIALS, ...PCT_TOOLS];
  for (let i = current.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [current[i], current[j]] = [current[j], current[i]];
  }
  mode = 'images';
  index = 0;
  render();
}

function setFilter(f, m, btn) {
  document.querySelectorAll('#btns-pre .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  mode = m;
  current = f === 'tape' ? [...TAPE] : f === 'all' ? [...TOOLS] : TOOLS.filter(t => t.cat === f);
  index = 0;
  render();
}

function shuffleAll() {
  document.querySelectorAll('#btns-pre .filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('#btns-pre .filter-btn').classList.add('active');
  const imageDeck = TOOLS.map(t => ({...t, _type:'images'}));
  const funcDeck = TOOLS.map(t => ({...t, _type:'functions'}));
  current = [...imageDeck, ...funcDeck];
  for (let i = current.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [current[i], current[j]] = [current[j], current[i]];
  }
  index = 0;
  render();
}

function shuffle() {
  for (let i = current.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [current[i], current[j]] = [current[j], current[i]];
  }
  index = 0;
  render();
}

function flip() {
  document.getElementById('card').classList.toggle('flipped');
  const flipped = document.getElementById('card').classList.contains('flipped');
  document.getElementById('hint').textContent = flipped ? 'click to hide' : 'click to reveal';
}

function prev() {
  index = (index - 1 + current.length) % current.length;
  render();
}

function next() {
  index = (index + 1) % current.length;
  render();
}

function render() {
  const tool = current[index];
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('hint').textContent = 'click to reveal';

  const imgEl = document.getElementById('cardImg');
  const nameFront = document.getElementById('cardNameFront');
  const tapeCap = document.getElementById('tapeCap');
  const nameBack = document.getElementById('cardName');
  const desc = document.getElementById('cardDesc');
  const cardMode = tool._type || mode;

  if (cardMode === 'images') {
    imgEl.src = tool.img; imgEl.alt = tool.name; imgEl.style.display = 'block';
    nameFront.style.display = 'none';
    tapeCap.style.display = 'none';
    nameBack.textContent = tool.name; nameBack.style.display = 'block';
    desc.style.display = 'none';
  } else if (tool.img && tool.cat === 'tape') {
    imgEl.src = tool.img; imgEl.alt = tool.name; imgEl.style.display = 'block';
    nameFront.style.display = 'none';
    tapeCap.textContent = tool.name; tapeCap.style.display = 'block';
    nameBack.style.display = 'none';
    desc.textContent = tool.func; desc.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
    nameFront.textContent = tool.name; nameFront.style.display = 'flex';
    tapeCap.style.display = 'none';
    nameBack.style.display = 'none';
    desc.textContent = tool.func; desc.style.display = 'block';
  }

  document.getElementById('cardCat').textContent = tool.cat === 'hand' ? 'Hand Tool' : tool.cat === 'power' ? 'Power Tool' : tool.cat === 'material' ? 'Material' : tool.cat === 'pct-tool' ? 'Tool' : 'Tape Measure';
  document.getElementById('counter').textContent = `${index + 1} of ${current.length}`;
  document.getElementById('count').textContent = `${current.length} cards`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prev();
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
});

render();
</script>
