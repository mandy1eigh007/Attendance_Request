<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand &amp; Power Tool Study Cards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#111;color:#fff;min-height:100vh}
header{padding:20px 24px 12px;border-bottom:1px solid #2a2a2a}
header h1{font-size:1.3rem;font-weight:700}
header p{font-size:0.82rem;color:#666;margin-top:4px}
.controls{padding:14px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #1e1e1e}
.tab-btn{padding:7px 18px;border:1px solid #3a3a3a;background:transparent;color:#888;border-radius:4px;cursor:pointer;font-size:0.88rem;transition:all 0.15s}
.tab-btn:hover{border-color:#666;color:#ccc}
.tab-btn.active{background:#fff;color:#000;border-color:#fff}
.shuffle-btn{padding:7px 18px;border:1px solid #3a3a3a;background:transparent;color:#888;border-radius:4px;cursor:pointer;font-size:0.88rem;margin-left:4px}
.shuffle-btn:hover{border-color:#666;color:#ccc}
.count{color:#555;font-size:0.82rem;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:20px 24px 48px}
.card-wrap{perspective:900px;cursor:pointer;user-select:none}
.card-wrap:focus-visible{outline:2px solid #888;outline-offset:2px;border-radius:8px}
.card-ratio{position:relative;width:100%;padding-top:57.09%}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 0.38s ease}
.card-wrap.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;overflow:hidden}
.card-front{background:#1a1a1a;border:1px solid #2a2a2a}
.card-front img{width:100%;height:100%;object-fit:cover;display:block}
.card-back{background:#1c1c1c;border:1px solid #2d2d2d;transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.card-back .name{font-size:1.05rem;font-weight:700;line-height:1.35;color:#f0f0f0}
.card-back .cat-label{font-size:0.7rem;color:#444;margin-top:8px;text-transform:uppercase;letter-spacing:0.07em}
</style>
</head>
<body>

<header>
  <h1>Hand &amp; Power Tool Study Cards</h1>
  <p>Click a card to reveal the tool name</p>
</header>

<div class="controls">
  <button class="tab-btn active" onclick="setFilter('all',this)">All Tools</button>
  <button class="tab-btn" onclick="setFilter('hand',this)">Hand Tools</button>
  <button class="tab-btn" onclick="setFilter('power',this)">Power Tools</button>
  <button class="shuffle-btn" onclick="shuffle()">Shuffle</button>
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"></div>

<script>
const TOOLS = [
  {cat:'hand',img:'images/ht-1.jpg',name:'String Line'},
  {cat:'hand',img:'images/ht-3.jpg',name:'Drywall Saw'},
  {cat:'hand',img:'images/ht-5.jpg',name:'C-Clamp'},
  {cat:'hand',img:'images/ht-7.jpg',name:'Framing Square'},
  {cat:'hand',img:'images/ht-9.jpg',name:'Spirit Level'},
  {cat:'hand',img:'images/ht-11.jpg',name:'Box-End Wrench / Closed-End Wrench'},
  {cat:'hand',img:'images/ht-13.jpg',name:'Open-End Wrench'},
  {cat:'hand',img:'images/ht-15.jpg',name:'Combination Wrench'},
  {cat:'hand',img:'images/ht-17.jpg',name:"Linemen's Pliers"},
  {cat:'hand',img:'images/ht-19.jpg',name:'Torpedo Level'},
  {cat:'hand',img:'images/ht-21.jpg',name:'Ratchet Wrench & Socket'},
  {cat:'hand',img:'images/ht-23.jpg',name:'Hacksaw'},
  {cat:'hand',img:'images/ht-25.jpg',name:'Chalk Line'},
  {cat:'hand',img:'images/ht-27.jpg',name:'Plumb Bob'},
  {cat:'hand',img:'images/ht-29.jpg',name:'Tenon Saw (Back Saw)'},
  {cat:'hand',img:'images/ht-31.jpg',name:'Handsaw'},
  {cat:'hand',img:'images/ht-33.jpg',name:'Cats Paw Nail Bar'},
  {cat:'hand',img:'images/ht-35.jpg',name:'Duplex Nail'},
  {cat:'hand',img:'images/ht-37.jpg',name:'Pipe Wrench'},
  {cat:'hand',img:'images/ht-39.jpg',name:'Cold Chisel'},
  {cat:'hand',img:'images/ht-41.jpg',name:'Adjustable Wrench'},
  {cat:'hand',img:'images/ht-43.jpg',name:'Mason Chisel'},
  {cat:'hand',img:'images/ht-45.jpg',name:'Wood Chisel'},
  {cat:'hand',img:'images/ht-47.jpg',name:'Paddle Bit'},
  {cat:'hand',img:'images/ht-49.jpg',name:'Tie Wire Reel'},
  {cat:'hand',img:'images/ht-51.jpg',name:'Margin Trowel'},
  {cat:'hand',img:'images/ht-53.jpg',name:'Hex Head Snap Tie'},
  {cat:'hand',img:'images/ht-55.jpg',name:'Nail Punch Set'},
  {cat:'hand',img:'images/ht-57.jpg',name:'Sledge Hammer'},
  {cat:'hand',img:'images/ht-59.jpg',name:'Line Level'},
  {cat:'hand',img:'images/ht-61.jpg',name:'Straight Cutting Snips'},
  {cat:'hand',img:'images/ht-63.jpg',name:'Speed Square'},
  {cat:'hand',img:'images/ht-65.jpg',name:'Drywall T-Square'},
  {cat:'hand',img:'images/ht-67.jpg',name:'Post Level'},
  {cat:'hand',img:'images/ht-69.jpg',name:'Locking Pliers'},
  {cat:'hand',img:'images/ht-71.jpg',name:'Ball-Peen Hammer'},
  {cat:'hand',img:'images/ht-73.jpg',name:'Crowbar'},
  {cat:'hand',img:'images/ht-75.jpg',name:'Needle Nose Pliers'},
  {cat:'hand',img:'images/ht-77.jpg',name:'Combination Square'},
  {cat:'hand',img:'images/ht-79.jpg',name:'Slip Joint Pliers'},
  {cat:'hand',img:'images/ht-81.jpg',name:'Straight Claw Framing Hammer'},
  {cat:'hand',img:'images/ht-83.jpg',name:'Curved Claw Hammer'},
  {cat:'power',img:'images/pt-1.jpg',name:'Drill Motor'},
  {cat:'power',img:'images/pt-3.jpg',name:'Jig Saw'},
  {cat:'power',img:'images/pt-5.jpg',name:'Impact Drill / Driver'},
  {cat:'power',img:'images/pt-7.jpg',name:'Hammer Drill'},
  {cat:'power',img:'images/pt-9.jpg',name:'Reciprocating Saw (Sawzall)'},
  {cat:'power',img:'images/pt-11.jpg',name:'Hole Saw'},
  {cat:'power',img:'images/pt-13.jpg',name:'Chop Saw'},
  {cat:'power',img:'images/pt-15.jpg',name:'Miter Saw'},
  {cat:'power',img:'images/pt-17.jpg',name:'Circular Saw'},
  {cat:'power',img:'images/pt-19.jpg',name:'Circular Saw Worm-Drive'},
  {cat:'power',img:'images/pt-21.jpg',name:'Table Saw'},
  {cat:'power',img:'images/pt-23.jpg',name:'Portable Band Saw (Portaband)'},
  {cat:'power',img:'images/pt-25.jpg',name:'Angle Grinder'},
  {cat:'power',img:'images/pt-27.jpg',name:'Ground Fault Circuit Interrupter (GFCI)'},
  {cat:'power',img:'images/pt-29.jpg',name:'Belt Sander'},
  {cat:'power',img:'images/pt-31.jpg',name:'Orbital Sander'},
  {cat:'power',img:'images/pt-33.jpg',name:'Router'},
  {cat:'power',img:'images/pt-35.jpg',name:'Nail Gun'},
  {cat:'power',img:'images/pt-37.jpg',name:'Cordless Gas Cut-Off Saw'},
  {cat:'power',img:'images/pt-39.jpg',name:'Jack Hammer'},
  {cat:'power',img:'images/pt-41.jpg',name:'Oscillating Multi-Tool'},
  {cat:'power',img:'images/pt-43.jpg',name:'Chain Saw'},
];

let current = [...TOOLS];

function setFilter(f, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  current = f === 'all' ? [...TOOLS] : TOOLS.filter(t => t.cat === f);
  render();
}

function shuffle() {
  for (let i = current.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [current[i], current[j]] = [current[j], current[i]];
  }
  render();
}

function render() {
  const grid = document.getElementById('grid');
  document.getElementById('count').textContent = current.length + ' cards';
  grid.innerHTML = '';
  current.forEach(tool => {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.tabIndex = 0;
    wrap.innerHTML =
      '<div class="card-ratio"><div class="card-inner">' +
      '<div class="card-face card-front"><img src="' + tool.img + '" alt="' + tool.name + '" loading="lazy"></div>' +
      '<div class="card-face card-back"><div class="name">' + tool.name + '</div>' +
      '<div class="cat-label">' + (tool.cat === 'hand' ? 'Hand Tool' : 'Power Tool') + '</div></div>' +
      '</div></div>';
    wrap.addEventListener('click', () => wrap.classList.toggle('flipped'));
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wrap.classList.toggle('flipped'); }
    });
    grid.appendChild(wrap);
  });
}

render();
</script>
</body>
</html>
